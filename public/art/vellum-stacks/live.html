<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../../favicon.png" type="image/png">
<title>The Vellum Stacks</title>
<meta name="description" content="An archive of translucent paper in an endless concrete hall over black water; the coffers of the ceiling open where it is read.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: one fixed WebGL canvas; small labels in the corners, and a large district card that rises over the scene like signage on concrete. */
:root {
  --void: #000000;
  --paint: #ece8e0;
  --label: rgba(236, 232, 224, 0.80);
  --label-dim: rgba(236, 232, 224, 0.46);
  --label-faint: rgba(236, 232, 224, 0.26);
  --font: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--label); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; background: var(--void); }
#c.dragging { cursor: grabbing; }
.ui { position: fixed; inset: 0; pointer-events: none; }
.ui > * { position: absolute; }
.title { left: 24px; top: calc(22px + env(safe-area-inset-top, 0px)); }
.title h1 { margin: 0; font-weight: 800; font-stretch: 85%; font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; }
.title p { margin: 6px 0 0; font-size: 12px; font-weight: 400; color: var(--label-dim); letter-spacing: 0.04em; }
.card { left: 20px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); opacity: 0; transition: opacity 1.4s ease; }
.card.on { opacity: 1; }
.card .kind { font-size: 12px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--label-dim); margin: 0 0 4px 5px; }
.card .code { font-weight: 900; font-stretch: 70%; font-size: clamp(72px, 15vw, 236px); line-height: 0.84; letter-spacing: -0.01em; color: var(--paint); opacity: 0.9; font-variant-numeric: tabular-nums; }
.hint { left: 24px; right: 170px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--label-dim); line-height: 1.9; transition: opacity 3s ease; }
.hint.faded { opacity: 0; }
.index { right: 24px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; }
.index .others { font-size: 12px; font-weight: 400; letter-spacing: 0.06em; color: var(--label-dim); min-height: 1.2em; }
.index button { pointer-events: auto; background: none; border: 0; padding: 4px 0 0; margin: 0; color: var(--label-faint); font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; }
.index button:hover, .index button:focus-visible { color: var(--label); outline: none; }
.index .leave { pointer-events: auto; padding: 4px 0 0; color: var(--label-faint, rgba(255,255,255,.4)); font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; }   /* added for kylexu.art: back to the work's page */
.index .leave:hover, .index .leave:focus-visible { color: var(--label, #fff); outline: none; }
.index button:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
.fallback { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(36ch, calc(100% - 48px)); text-align: center; font-size: 14px; line-height: 1.6; color: var(--label-dim); }
@media (max-width: 600px) {
  .title { left: 18px; }
  .card { left: 14px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .hint { left: 18px; right: 110px; font-size: 10px; }
  .index { right: 18px; }
}
@media (prefers-reduced-motion: reduce) { .hint, .card { transition: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="An endless concrete hall with a coffered ceiling over black water; translucent paper hangs in rows and rises into the light where the coffers open"></canvas>
<div class="ui">
  <div class="title">
    <h1>The Vellum Stacks</h1>
    <p>an archive that opens where it is read</p>
  </div>
  <div class="card" id="card" aria-live="polite"><div class="kind" id="cardKind"></div><div class="code" id="cardCode"></div></div>
  <div class="hint" id="hint">drag to look &middot; scroll to walk &middot; click to walk on &middot; stay, and the ceiling opens &middot; sound starts at your first touch</div>
  <div class="index">
    <div class="others" id="others"></div>
    <button type="button" id="snd">Sound off</button>
    <button type="button" id="fs">Fullscreen</button>
    <a class="leave" href="../vellum-stacks">Leave</a>
  </div>
  <div class="fallback" id="fallback" hidden>This piece needs WebGL 2, which this browser or device does not provide.</div>
</div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';

const canvas = document.getElementById('c');
const hintEl = document.getElementById('hint');
const fsBtn = document.getElementById('fs');
const othersEl = document.getElementById('others');
const sndBtn = document.getElementById('snd');
const cardEl = document.getElementById('card');
const cardKind = document.getElementById('cardKind');
const cardCode = document.getElementById('cardCode');

const QS = new URLSearchParams(location.search);
const coarse = matchMedia('(pointer: coarse)').matches;
const small = Math.min(innerWidth, innerHeight) < 640;
const lite = (coarse || small) && !QS.has('full');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, stencil: false, depth: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) {
  document.getElementById('fallback').hidden = false;
  throw new Error('WebGL 2 unavailable');
}
renderer.autoClear = false;
renderer.setClearColor(0x000000, 1);

// ---------------------------------------------------------------- the building
// Units are metres. One bay of 8 m governs everything: the coffers of the ceiling, the rows of
// paper, the piers, the openings. The plan repeats every 45 bays and is re-wrapped around the
// camera in the shaders, so the hall has no edge. The rule: where a reader stands, the coffers
// above lift away, light falls, and the threads draw the paper up into it.
const M = 8, NB = 45, T = M * NB, NBB = NB * NB;
const DIST = 5, ND = NB / DIST;               // districts of 5 x 5 bays, A-01 to I-09
const H0 = 46, RIB_D = 1.6, RIB_W = 1.4, LID_T = 0.7, LID_LIFT = 9;
const HC = H0 + RIB_D;                         // the top of the coffers, where the lids rest
const SKY_Y = H0 + 46;
const EYE = 1.6;
const DATUM = 0.9;                             // every sheet ends at the same height above the water
const HEIGHTS = [7.5, 15, 22.5];
const FOG_NEAR = 16, FOG_FAR = lite ? 140 : 178;
const Q = lite ? 0.6 : 1.0;
const NREAD = 12;
const HOLD = 45;                               // seconds an opening stays after its reader leaves
const SUN = new THREE.Vector3(0.15, -1, 0.09).normalize();
const SUNOFF_X = (-SUN.x / -SUN.y) * (HC - EYE), SUNOFF_Z = (-SUN.z / -SUN.y) * (HC - EYE);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261008);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { t = clamp((t - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash2(i, j, s) { const h = Math.sin(i * 127.1 + j * 311.7 + s * 74.7) * 43758.5453; return h - Math.floor(h); }
function pnoise(x, z, n, s) {
  const X = x * n, Z = z * n, xi = Math.floor(X), zi = Math.floor(Z);
  const xf = X - xi, zf = Z - zi, sx = xf * xf * (3 - 2 * xf), sz = zf * zf * (3 - 2 * zf);
  const h = (i, j) => hash2(((i % n) + n) % n, ((j % n) + n) % n, s);
  return lerp(lerp(h(xi, zi), h(xi + 1, zi), sx), lerp(h(xi, zi + 1), h(xi + 1, zi + 1), sx), sz);
}
function fbm(x, z, n, s, oct) { let v = 0, w = 0.5, tot = 0; for (let o = 0; o < oct; o++) { v += w * pnoise(x, z, n, s + o * 17); tot += w; w *= 0.5; n *= 2; } return v / tot; }
function wdelta(a, b) { let d = a - b; d -= Math.round(d / T) * T; return d; }
function wdist(x, z, cx, cz) { return Math.hypot(wdelta(x, cx), wdelta(z, cz)); }
const mod = (a, n) => ((a % n) + n) % n;
const bayIdx = (i, j) => mod(j, NB) * NB + mod(i, NB);
const bayOf = v => Math.floor(mod(v, T) / M);
const wdb = (a, b) => { let d = a - b; d -= Math.round(d / NB) * NB; return d; };
const bayCenter = (i, j) => ({ x: (mod(i, NB) + 0.5) * M, z: (mod(j, NB) + 0.5) * M });
const districtOfBay = (i, j) => Math.floor(mod(j, NB) / DIST) * ND + Math.floor(mod(i, NB) / DIST);
const districtName = d => String.fromCharCode(65 + (d % ND)) + '-' + String(Math.floor(d / ND) + 1).padStart(2, '0');

// ---------------------------------------------------------------- the plan
// Five skylights are always open: the reading rooms. Paper gathers around the light.
const SKYLIGHTS = [
  { i: 17, j: 21, w: 5, h: 4 },
  { i: 5,  j: 6,  w: 3, h: 2 },
  { i: 33, j: 7,  w: 2, h: 3 },
  { i: 7,  j: 34, w: 2, h: 2 },
  { i: 34, j: 32, w: 3, h: 3 },
];
const GREAT = SKYLIGHTS[0];
const GREAT_X = (GREAT.i + GREAT.w / 2) * M, GREAT_Z = (GREAT.j + GREAT.h / 2) * M;
const isSkyBay = (i, j) => SKYLIGHTS.some(s => mod(i - s.i, NB) < s.w && mod(j - s.j, NB) < s.h);
function skyDistBays(i, j) {
  let best = 1e9;
  for (const s of SKYLIGHTS) {
    const cx = s.i + (s.w - 1) / 2, cz = s.j + (s.h - 1) / 2;
    const dx = Math.max(Math.abs(wdb(i, cx)) - (s.w - 1) / 2, 0), dz = Math.max(Math.abs(wdb(j, cz)) - (s.h - 1) / 2, 0);
    best = Math.min(best, Math.hypot(dx, dz));
  }
  return best;
}
function bayDensity(i, j) {
  const d = skyDistBays(i, j);
  const near = Math.exp(-(d * d) / (2 * 3.4 * 3.4));
  const n = fbm((i + 0.5) / NB, (j + 0.5) / NB, 5, 11, 3);
  return clamp(0.05 + 0.85 * near * (0.7 + 0.6 * n) + 0.22 * smooth(0.58, 0.82, n), 0, 1);
}
const bayPermanent = new Uint8Array(NBB), bayDens = new Float32Array(NBB), bayHash = new Float32Array(NBB);
const districtSky = new Uint8Array(ND * ND), districtAlong = new Uint8Array(ND * ND);
for (let j = 0; j < NB; j++) for (let i = 0; i < NB; i++) {
  const b = bayIdx(i, j);
  bayPermanent[b] = isSkyBay(i, j) ? 1 : 0;
  bayDens[b] = bayDensity(i, j);
  bayHash[b] = hash2(i, j, 5);
  if (bayPermanent[b]) districtSky[districtOfBay(i, j)] = 1;
}
for (let d = 0; d < ND * ND; d++) districtAlong[d] = (d % ND) % 2;

// ---------------------------------------------------------------- the paper
// Rows of sheets inside each bay, parallel within a district and turned 90 degrees between
// districts. Three heights in the ratio 1 : 2 : 3. Every sheet hangs from one thread that runs up
// to the lid of its coffer.
const S = { pos: [], size: [], rot: [], liftMax: [], bay: [] };
const baySheets = Array.from({ length: NBB }, () => []);
function pickHeight(dens, i, j, k) {
  const r = hash2(i * 3 + k, j * 7 + k, 13), tall = 0.12 + 0.5 * dens;
  return r < tall ? 2 : r < tall + 0.38 ? 1 : 0;
}
for (let j = 0; j < NB; j++) for (let i = 0; i < NB; i++) {
  const b = bayIdx(i, j), dens = bayDens[b];
  const n = Math.min(bayPermanent[b] ? 1 : 4, Math.floor(dens * 2.8 * Q + hash2(i, j, 9)));
  if (n <= 0) continue;
  const along = districtAlong[districtOfBay(i, j)];
  const cx = (i + 0.5) * M, cz = (j + 0.5) * M;
  const slots = n === 1 ? [hash2(i, j, 21) < 0.5 ? -0.9 : 0.9] : n === 2 ? [-0.9, 0.9] : n === 3 ? (hash2(i, j, 22) < 0.5 ? [-2.6, -0.9, 0.9] : [-0.9, 0.9, 2.6]) : [-2.6, -0.9, 0.9, 2.6];
  for (let k = 0; k < n; k++) {
    const off = slots[k];
    const x = along ? cx + off : cx, z = along ? cz : cz + off;
    const hc = pickHeight(dens, i, j, k), h = HEIGHTS[hc], w = 4.8, top = DATUM + h;
    baySheets[b].push(S.pos.length / 3);
    S.pos.push(x, top, z); S.size.push(w, h, 0.85); S.rot.push(along ? Math.PI / 2 : 0, hc, rand(), rand() * 6.2832);
    S.liftMax.push(Math.max(0, HC + 3.2 - top) * (bayPermanent[b] ? 0.5 : 1)); S.bay.push(b);
  }
}
const sheetCount = S.pos.length / 3;

// ---------------------------------------------------------------- readers
const PLACES = [];
for (const s of SKYLIGHTS) {
  PLACES.push(bayCenter(s.i - 1, s.j + (s.h >> 1)));
  PLACES.push(bayCenter(s.i + s.w, s.j + Math.max(0, (s.h >> 1) - 1)));
}
for (let k = 0; k < 4; k++) {
  let i, j, tries = 0;
  do { i = Math.floor(rand() * NB); j = Math.floor(rand() * NB); tries++; } while ((isSkyBay(i, j) || bayDensity(i, j) > 0.3) && tries < 80);
  PLACES.push(bayCenter(i, j));
}
const readers = [];
for (let k = 0; k < NREAD; k++) {
  const p = PLACES[(k * 3 + 1) % PLACES.length];
  const on = k === 0 || k < (lite ? 7 : NREAD);
  readers.push({ x: k === 0 ? 0 : p.x, z: k === 0 ? 0 : p.z, tx: 0, tz: 0, hx: 0, hz: 1, yaw: rand() * 6.2832, walking: false, timer: 20 + rand() * 60, dwell: 10 + rand() * 60, speed: 0.7 + rand() * 0.35, k: 0, lev: 0, active: on, simActive: on, real: false, wasStill: false });
}
function pickPlace(r) {
  let p;
  do { p = PLACES[Math.floor(rand() * PLACES.length)]; } while (wdist(p.x, p.z, r.x, r.z) < 6);
  r.tx = p.x; r.tz = p.z; r.walking = true;
}
// how much of the ceiling a reader opens: one coffer, then three by three
function readerField(r) {
  if (r.walking) { r.k = 0; r.lev = 0; }
  else if (r.dwell >= 20) { r.k = 3; r.lev = 1; }
  else if (r.dwell >= 1.2) { r.k = 1; r.lev = 1; }
  else { r.k = 0; r.lev = 0; }
}

// ---------------------------------------------------------------- shared GLSL
function dataTex(data, filter) {
  const t = new THREE.DataTexture(data, NB, NB, THREE.RedFormat, THREE.UnsignedByteType);
  t.unpackAlignment = 1; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.minFilter = t.magFilter = filter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
}
const bayData = new Uint8Array(NBB), softData = new Uint8Array(NBB), densData = new Uint8Array(NBB);
for (let b = 0; b < NBB; b++) densData[b] = Math.round(255 * bayDens[b]);
const bayTex = dataTex(bayData, THREE.NearestFilter), softTex = dataTex(softData, THREE.LinearFilter), densTex = dataTex(densData, THREE.LinearFilter);

const U = {
  uTime: { value: 0 }, uTile: { value: T }, uFogNear: { value: FOG_NEAR }, uFogFar: { value: FOG_FAR },
  uCamPos: { value: new THREE.Vector3() }, uSun: { value: SUN.clone() }, uDpr: { value: 1 },
  uBay: { value: bayTex }, uBaySoft: { value: softTex }, uDensity: { value: densTex },
};

const COMMON = /* glsl */`
uniform float uTime;
uniform float uTile;
uniform float uFogNear;
uniform float uFogFar;
uniform vec3 uCamPos;
uniform vec3 uSun;
uniform sampler2D uBay;
uniform sampler2D uBaySoft;
uniform sampler2D uDensity;
const float M = ${M.toFixed(1)};
const float NB = ${NB.toFixed(1)};
const float H0 = ${H0.toFixed(1)};
const float RIB_D = ${RIB_D.toFixed(2)};
const float RIB_W = ${RIB_W.toFixed(2)};
const float HC = ${HC.toFixed(2)};
const float LID_LIFT = ${LID_LIFT.toFixed(1)};
vec2 pdelta(vec2 a, vec2 b) { vec2 d = a - b; return mod(d + 0.5 * uTile, uTile) - 0.5 * uTile; }
vec2 wrapXZ(vec2 p) { return uCamPos.xz + pdelta(p, uCamPos.xz); }
float fogAt(vec3 wp) { return smoothstep(uFogNear, uFogFar, distance(wp, uCamPos)); }
float lidE(float o) { return o * o * (3.0 - 2.0 * o); }
float bayOpen(vec2 xz) { vec2 c = mod(floor(xz / M), NB); return texture2D(uBay, (c + 0.5) / NB).r; }
// light through the coffer of the bay containing xz: the open fraction, cut by the ribs
float holeAt(vec2 xz) {
  vec2 f = fract(xz / M);
  float e = 0.5 * RIB_W / M, s = 0.1 / M;
  vec2 m = smoothstep(e - s, e + s, f) * (1.0 - smoothstep(1.0 - e - s, 1.0 - e + s, f));
  return m.x * m.y * bayOpen(xz);
}
// is p in the direct light? Follow the light back up through the bottom and the top of the coffers.
float sunlit(vec3 p) {
  vec3 up = -uSun;
  if (p.y >= HC) return 1.0;
  float b = holeAt(p.xz + up.xz * ((HC - p.y) / up.y));
  if (p.y >= H0) return b;
  return min(b, holeAt(p.xz + up.xz * ((H0 - p.y) / up.y)));
}
float softAt(vec2 xz) { return texture2D(uBaySoft, xz / uTile).r; }
float densityAt(vec2 xz) { return texture2D(uDensity, xz / uTile).r; }
float transAt(vec3 p) { return exp(-0.026 * max(0.0, H0 - p.y) * densityAt(p.xz) * (1.0 - min(1.0, softAt(p.xz) * 1.5))); }
vec3 ambientAt(vec3 wp) {
  float h = clamp(wp.y / H0, 0.0, 1.0);
  return vec3(0.55, 0.58, 0.64) * (0.06 + 0.04 * h) + vec3(1.0, 0.94, 0.84) * softAt(wp.xz) * (0.16 + 0.24 * h);
}
vec3 illumAt(vec3 wp, out float direct) {
  float s = sunlit(wp) * transAt(wp);
  direct = s;
  return ambientAt(wp) + vec3(1.0, 0.95, 0.86) * s * 1.35;
}
float reflAt(vec3 wpm) {
  vec3 d = normalize(wpm - uCamPos);
  float cosT = max(0.0, -d.y);
  float F = 0.2 + 0.8 * pow(1.0 - cosT, 3.0);
  return F * exp(-max(0.0, -wpm.y) * 0.016);
}
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

  vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);

`;

// ---------------------------------------------------------------- paper
const sheetVert = COMMON + /* glsl */`
attribute vec3 iPos;
attribute vec3 iSize;
attribute vec4 iRot;
attribute float iLift;
attribute float iSway;
attribute float iKept;
uniform float uMirror;
varying vec2 vUv;
varying vec3 vWorld;
varying vec3 vLit;
varying vec3 vNormal;
varying float vFog;
varying vec4 vData;
varying float vOp;
varying float vRefl;
varying float vLift;
varying float vKept;
mat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0.0, -s, 0.0, 1.0, 0.0, s, 0.0, c); }
void main() {
  vUv = uv;
  float w = iSize.x, h = iSize.y;
  float yaw = iRot.x, seed = iRot.z, phase = iRot.w;
  vec2 axz = wrapXZ(iPos.xz);
  if (distance(axz, uCamPos.xz) > uFogFar + 25.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); vFog = 1.0; return; }
  vec3 anchor = vec3(axz.x, iPos.y + iLift, axz.y);
  float hang = 1.0 - uv.y;
  mat3 R = rotY(yaw);
  vec3 n = R * vec3(0.0, 0.0, 1.0);
  vec3 local = vec3((uv.x - 0.5) * w, -hang * h, 0.0);
  float bend = pow(hang, 1.6);
  local.z += bend * (sin(uv.x * 3.14159) * 0.008 * h * sin(seed * 12.0) + iSway * sin(uTime * 2.1 + phase) * 0.025 * h);
  local = R * local;
  vec3 wp = anchor + local;
  vLit = wp; vRefl = 1.0;
  if (uMirror < 0.0) { wp.y = -wp.y; n.y = -n.y; vRefl = reflAt(wp); }
  vWorld = wp; vNormal = n; vData = vec4(seed, iRot.y, w, h); vOp = iSize.z; vLift = iLift; vKept = iKept;
  vFog = fogAt(wp);
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}
`;
const sheetFrag = COMMON + /* glsl */`
varying vec2 vUv;
varying vec3 vWorld;
varying vec3 vLit;
varying vec3 vNormal;
varying float vFog;
varying vec4 vData;
varying float vOp;
varying float vRefl;
varying float vLift;
varying float vKept;
uniform float uOpacity;
// ruled entries of an archive sheet; a few of them are blacked out
vec2 textBlock(vec2 uv, float seed) {

// piece is a harmonic of it. Each open coffer near you holds one of those harmonics, so the great
// skylight is a chord you walk toward, and a reader's opening enters note by note. While lids move,
// their notes drift a little out of tune and beat; when the lids come to rest, the notes settle.

let cardDistrict = -1, districtNow = -1, districtSince = 0, cardTimer = 0, cardsShown = 0;
function showCard(d) {
  cardKind.textContent = districtSky[d] ? 'Reading room' : 'Stacks';
  cardCode.textContent = districtName(d);
  cardEl.classList.add('on');
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => cardEl.classList.remove('on'), 4200);
  cardDistrict = d; cardsShown++;
}

// ---------------------------------------------------------------- the first moment
// A reader is already standing in the light ahead of you, and the ceiling above them is opening.
{
  const r = readers[1], p = bayCenter(bayOf(START.x - 12), bayOf(START.z + 34));
  r.x = p.x; r.z = p.z; r.walking = false; r.dwell = 16; r.timer = 100 + rand() * 40; r.yaw = 2.4; r.active = true;
}
readers[0].x = cam.x; readers[0].z = cam.z; readers[0].dwell = 0; readers[0].walking = true;
for (const r of readers) readerField(r);
apPick();
ap.tx = GREAT_X; ap.tz = GREAT_Z - 22;
horizon.material.uniforms.uMono.value = 1.5 * Math.PI + 0.32;
if (QS.has('pitch') || QS.has('yaw') || QS.has('at')) {
  auto = 0; lastInput = 1e12;
  man.pitch = parseFloat(QS.get('pitch') || '0.2'); man.yaw = parseFloat(QS.get('yaw') || String(Math.PI));
  if (QS.has('at')) { const p = PLACES[parseInt(QS.get('at'), 10) % PLACES.length]; man.x = p.x; man.z = p.z; }
}
updateBays(0, true);
updateLifts(0.016, true);

// ---------------------------------------------------------------- frame
const t0 = performance.now() / 1000;
let last = t0, ema = 1 / 60, adaptAt = t0 + 3, prevX = cam.x, prevZ = cam.z, expireAt = 0;
function frame() {
  requestAnimationFrame(frame);
  const nowS = performance.now() / 1000;
  const dt = Math.min(0.05, nowS - last);
  last = nowS;
  const t = nowS - t0; tNow = t;
  U.uTime.value = t;

  ema += (dt - ema) * 0.05;
  if (nowS > adaptAt) {
    adaptAt = nowS + 2.5;
    const cap = Math.min(devicePixelRatio || 1, lite ? 1.5 : 2);
    if (ema > 1 / 36 && dpr > 0.75) { dpr = Math.max(0.75, dpr - 0.25); resize(); }
    else if (ema < 1 / 70 && dpr < cap) { dpr = Math.min(dpr + 0.25, cap); resize(); }
  }

  // who leads: the walk, or the hand
  const wantAuto = (t - lastInput) > 25;
  auto = clamp(auto + (wantAuto ? dt / 8 : -dt / 0.6), 0, 1);
  const k = smooth(0, 1, auto);
  if (auto > 0.001) updateAuto(dt, t);
  if (keys.has('KeyW') || keys.has('ArrowUp')) vel.f = clamp(vel.f + 2.2 * dt, -3.5, 3.5);
  if (keys.has('KeyS') || keys.has('ArrowDown')) vel.f = clamp(vel.f - 2.2 * dt, -3.5, 3.5);
  if (keys.has('KeyA') || keys.has('ArrowLeft')) vel.yaw += 1.2 * dt;
  if (keys.has('KeyD') || keys.has('ArrowRight')) vel.yaw -= 1.2 * dt;
  if (keys.size) touched();
  man.yaw += vel.yaw * dt; man.pitch = clamp(man.pitch + vel.pitch * dt, -0.9, 1.25);
  man.x += -Math.sin(man.yaw) * vel.f * dt; man.z += -Math.cos(man.yaw) * vel.f * dt;
  vel.f *= Math.exp(-dt * 1.4); vel.yaw *= Math.exp(-dt * 3.5); vel.pitch *= Math.exp(-dt * 3.5);
  pushOutOfPiers(man);
  man.x = mod(man.x, T); man.z = mod(man.z, T);
  cam.x = man.x + wdelta(ap.x, man.x) * k; cam.z = man.z + wdelta(ap.z, man.z) * k; cam.y = EYE;
  cam.yaw = alerp(man.yaw, ap.yaw, k); cam.pitch = lerp(man.pitch, ap.pitch, k);
  if (auto >= 0.999) Object.assign(man, cam);
  fovNow = lerp(fovNow, lerp(50, ap.fov, k), 1 - Math.exp(-dt / 3));

  // the viewer is reader zero: standing still opens the ceiling
  const hx = wdelta(cam.x, prevX), hz = wdelta(cam.z, prevZ), moved = Math.hypot(hx, hz);
  prevX = cam.x; prevZ = cam.z;
  const me = readers[0];
  me.x = cam.x; me.z = cam.z;
  if (moved > 1e-4) { me.hx = hx / moved; me.hz = hz / moved; }
  const still = moved / Math.max(dt, 1e-3) < 0.2;
  const prevDwell = me.dwell;
  me.walking = !still;
  me.dwell = still ? me.dwell + dt : Math.max(0, me.dwell - dt * 3);
  if (me.wasStill && !still && prevDwell > 20) leavePage(me, true);
  me.wasStill = still;
  readerField(me);
  if (roomRef && t - lastSent > 0.5) {
    const px = Math.round(cam.x * 10) / 10, pz = Math.round(cam.z * 10) / 10, pd = Math.round(me.dwell);
    const key = px + ',' + pz + ',' + pd + ',' + me.walking;
    if (key !== sentKey) { sentKey = key; lastSent = t; roomRef.presence({ x: px, z: pz, d: pd, w: me.walking }).catch(() => {}); }
  }
  camPos.x = cam.x; camPos.z = cam.z; camPos.yaw = cam.yaw;
  updateReaders(dt);
  updateBays(t, false);
  updateLifts(dt, false);
  if (t > expireAt) { expireAt = t + 2; expireKept(); }
  updateSound(dt);

  const lk = 1 - Math.exp(-dt * 1.3), amp = reduceMotion ? 0.3 : 1;
  lean.x += (mx * 0.6 * amp - lean.x) * lk; lean.y += (-my * 0.3 * amp - lean.y) * lk;
  lean.yaw += (-mx * 0.03 * amp - lean.yaw) * lk; lean.pitch += (-my * 0.02 * amp - lean.pitch) * lk;
  const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  camera.position.set(cam.x + rx * lean.x, cam.y + lean.y, cam.z + rz * lean.x);
  camera.rotation.set(cam.pitch + lean.pitch, cam.yaw + lean.yaw, 0);
  camera.fov = camera.aspect < 1 ? 2 * Math.atan(Math.tan(fovNow * Math.PI / 360) / camera.aspect) * 180 / Math.PI : fovNow;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  U.uCamPos.value.copy(camera.position);
  water.position.set(camera.position.x, 0, camera.position.z);
  skies[0].position.set(camera.position.x, SKY_Y, camera.position.z);
  skies[1].position.set(camera.position.x, -SKY_Y, camera.position.z);
  horizon.position.set(camera.position.x, 0, camera.position.z);
  compMat.uniforms.uFade.value = clamp((t - 0.3) / 4.0, 0, 1);

  const dNow = districtOfBay(bayOf(cam.x), bayOf(cam.z));
  if (dNow !== districtNow) { districtNow = dNow; districtSince = t; }
  else if (dNow !== cardDistrict && t - districtSince > (cardsShown ? 0.8 : 2.2)) showCard(dNow);

  // depth of the solid things, for the light; then the hall; then the light itself
  camera.layers.set(1);
  renderer.setRenderTarget(depthRT); renderer.clear(true, true, false); renderer.render(scene, camera);
  camera.layers.set(0);
  renderer.setRenderTarget(sceneRT); renderer.clear(true, true, false); renderer.render(scene, camera);
  pass(volMat, volRT);
  blur(volRT, volRT2, 1.0);
  down(sceneRT, rtA, 0.3);
  blur(rtA, rtA2, 1.0);
  blur(rtA, rtA2, 1.6);
  down(rtA, rtB, 0.0);
  blur(rtB, rtB2, 1.2);
  blur(rtB, rtB2, 2.0);
  pass(compMat, null);
}
frame();
console.log('sheets', sheetCount, 'threads', sheetCount, 'bays', NBB, 'piers', ND * ND, 'readers', readers.filter(r => r.active).length);
</script>
