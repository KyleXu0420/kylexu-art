<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../../favicon.png" type="image/png">
</head>
<body>
<title>The Vellum Stacks</title>
<meta name="description" content="An archive of translucent paper over black water that opens where it is read.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap">
<style>
/* Layout: one fixed WebGL canvas fills the viewport; a few lines of small type sit in the corners like wall labels in a gallery. */
:root {
  --void: #000000;
  --paper: #ece4d2;
  --label: rgba(236, 228, 210, 0.74);
  --label-dim: rgba(236, 228, 210, 0.42);
  --label-faint: rgba(236, 228, 210, 0.24);
  --font-display: 'Cormorant Garamond', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--label); font-family: var(--font-display); overflow: hidden; -webkit-font-smoothing: antialiased; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; background: var(--void); }
#c.dragging { cursor: grabbing; }
.ui { position: fixed; inset: 0; pointer-events: none; }
.ui > * { position: absolute; }
.title { left: 24px; top: calc(22px + env(safe-area-inset-top, 0px)); }
.title h1 { margin: 0; font-weight: 400; font-size: 15px; letter-spacing: 0.26em; text-transform: uppercase; text-wrap: balance; }
.title p { margin: 5px 0 0; font-size: 14px; font-style: italic; font-weight: 300; color: var(--label-dim); letter-spacing: 0.03em; }
.hint { left: 24px; right: 140px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--label-dim); line-height: 1.9; transition: opacity 3s ease; }
.hint.faded { opacity: 0; }
.index { right: 24px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; }
.index .others { font-style: italic; font-weight: 300; font-size: 13px; letter-spacing: 0.06em; color: var(--label-dim); min-height: 1.2em; }
.index button { pointer-events: auto; background: none; border: 0; padding: 4px 0 0; margin: 0; color: var(--label-faint); font: inherit; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; }
.index button:hover, .index button:focus-visible { color: var(--label); outline: none; }
.index .leave { pointer-events: auto; padding: 4px 0 0; color: var(--label-faint); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; }   /* added for kylexu.art: back to the work's page */
.index .leave:hover, .index .leave:focus-visible { color: var(--label); outline: none; }
.index button:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
.fallback { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(36ch, calc(100% - 48px)); text-align: center; font-size: 15px; line-height: 1.6; color: var(--label-dim); }
@media (max-width: 600px) {
  .title { left: 18px; }
  .hint { left: 18px; right: 100px; font-size: 10px; }
  .index { right: 18px; }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>
<canvas id="c" aria-label="Translucent paper sheets hanging over black water; they rise where a reader stands"></canvas>
<div class="ui">
  <div class="title">
    <h1>The Vellum Stacks</h1>
    <p>an archive that opens where it is read</p>
  </div>
  <div class="hint" id="hint">drag to look &middot; scroll to walk &middot; click to walk on &middot; stay, and the paper rises &middot; sound starts at your first touch</div>
  <div class="index">
    <div class="others" id="others"></div>
    <button type="button" id="snd">Sound off</button>
    <button type="button" id="fs">Fullscreen</button>
    <a class="leave" href="../vellum-stacks">Leave</a>
  </div>
  <div class="fallback" id="fallback" hidden>This piece needs WebGL 2, which this browser or device does not provide.</div>
</div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';

const canvas = document.getElementById('c');
const hintEl = document.getElementById('hint');
const fsBtn = document.getElementById('fs');
const othersEl = document.getElementById('others');
const sndBtn = document.getElementById('snd');

const coarse = matchMedia('(pointer: coarse)').matches;
const small = Math.min(innerWidth, innerHeight) < 640;
let lite = coarse || small;
if (new URLSearchParams(location.search).has('full')) lite = false;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, stencil: false, depth: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) {
  document.getElementById('fallback').hidden = false;
  throw new Error('WebGL 2 unavailable');
}
renderer.autoClear = false;
renderer.setClearColor(0x000000, 1);

// ---------------------------------------------------------------- the rule
// Five things: light, paper, thread, water, readers.
// Light falls through openings in an unseen roof. Paper gathers under the
// light, each sheet on a thread that runs up to the roof. Where a reader
// stands, the threads draw the paper up toward the light; the opening grows
// the longer they stay, and closes again slowly after they leave. The water
// reflects it all. Units are metres; the plan repeats every T metres.
const T = 360;
const ROOF = 52;
const EYE = 1.6;
const FOG_NEAR = 14, FOG_FAR = lite ? 130 : 170;
const Q = lite ? 0.6 : 1.0;
const NREAD = 12;                                   // reader 0 is the viewer

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261003);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { t = clamp((t - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash2(i, j, s) { const h = Math.sin(i * 127.1 + j * 311.7 + s * 74.7) * 43758.5453; return h - Math.floor(h); }
function pnoise(x, z, n, s) {
  const X = x * n, Z = z * n, xi = Math.floor(X), zi = Math.floor(Z);
  const xf = X - xi, zf = Z - zi, sx = xf * xf * (3 - 2 * xf), sz = zf * zf * (3 - 2 * zf);
  const h = (i, j) => hash2(((i % n) + n) % n, ((j % n) + n) % n, s);
  return lerp(lerp(h(xi, zi), h(xi + 1, zi), sx), lerp(h(xi, zi + 1), h(xi + 1, zi + 1), sx), sz);
}
function fbm(x, z, n, s, oct) { let v = 0, w = 0.5, tot = 0; for (let o = 0; o < oct; o++) { v += w * pnoise(x, z, n, s + o * 17); tot += w; w *= 0.5; n *= 2; } return v / tot; }
function wdelta(a, b) { let d = a - b; d -= Math.round(d / T) * T; return d; }
function wdist(x, z, cx, cz) { return Math.hypot(wdelta(x, cx), wdelta(z, cz)); }

// the openings in the roof: centre, full size (A-series proportions), rotation, intensity
const SKY = [
  { x: 80,  z: 80,  w: 24, h: 34, rot: 0.2,  i: 1.0 },
  { x: 230, z: 70,  w: 17, h: 24, rot: -0.6, i: 0.9 },
  { x: 170, z: 190, w: 34, h: 48, rot: 0.9,  i: 1.0 },
  { x: 60,  z: 250, w: 17, h: 24, rot: 0.4,  i: 0.8 },
  { x: 270, z: 260, w: 24, h: 34, rot: -1.1, i: 0.9 },
];
function skyFoot(x, z, s, grow) {
  const dx = wdelta(x, s.x), dz = wdelta(z, s.z), c = Math.cos(s.rot), sn = Math.sin(s.rot);
  const u = Math.abs(dx * c + dz * sn), v = Math.abs(-dx * sn + dz * c);
  return (1 - smooth(s.w / 2 + grow * 0.3, s.w / 2 + grow, u)) * (1 - smooth(s.h / 2 + grow * 0.3, s.h / 2 + grow, v));
}
// the plan is the light map: paper gathers under the openings
function density(x, z) {
  let d = 0;
  for (const s of SKY) d += skyFoot(x, z, s, 16) * s.i;
  d = clamp(d, 0, 1);
  const n = fbm(x / T, z / T, 6, 11, 3);
  return clamp(0.07 + 0.8 * d * (0.7 + 0.6 * n) + 0.12 * smooth(0.55, 0.8, n), 0, 1);
}
function orientation(x, z) { return Math.PI * 1.6 * fbm(x / T, z / T, 3, 23, 2); }
function scatter(cell, perM2, fn) {
  const nc = Math.round(T / cell), cs = T / nc;
  for (let i = 0; i < nc; i++) for (let j = 0; j < nc; j++) {
    const d = density((i + 0.5) * cs, (j + 0.5) * cs);
    const expected = perM2(d) * cs * cs;
    let n = Math.floor(expected); if (rand() < expected - n) n++;
    for (let k = 0; k < n; k++) fn(i * cs + rand() * cs, j * cs + rand() * cs, d);
  }
}
// places readers go to: under each opening, and a few in the dark
const PLACES = [];
for (const s of SKY) for (let k = 0; k < 2; k++) {
  const a = rand() * 6.2832, r = 2 + rand() * Math.min(s.w, s.h) * 0.35;
  PLACES.push({ x: s.x + Math.cos(a) * r, z: s.z + Math.sin(a) * r });
}
for (let k = 0; k < 4; k++) {
  let x, z, tries = 0;
  do { x = rand() * T; z = rand() * T; tries++; } while (density(x, z) > 0.25 && tries < 40);
  PLACES.push({ x, z });
}

// ---------------------------------------------------------------- generate the paper
// three sheet sizes in the A-series ratio: A0, 16A0 and 256A0
// two families of tall translucent slabs, towers and mid-rises, aligned to a street grid that turns slowly by district
const SIZES = [
  { w: [3.0, 7.0], h: [14, 30], bottom: [0.4, 2.0], lift: 20, per: 0.020, per0: 0.0022, cell: 12, op: 0.80 },
  { w: [2.5, 5.0], h: [6, 13],  bottom: [0.3, 1.5], lift: 12, per: 0.040, per0: 0.0030, cell: 8,  op: 0.90 },
];
const S = { pos: [], size: [], rot: [], liftMax: [] };
function addSheet(x, yTop, z, w, h, op, yaw, kind, seed, liftMax) {
  S.pos.push(x, yTop, z); S.size.push(w, h, op); S.rot.push(yaw, kind, seed, rand() * 6.2832); S.liftMax.push(liftMax);
}
function gridYaw(x, z) {
  const base = orientation(x, z) * 0.5;
  return Math.round(base / (Math.PI / 2)) * (Math.PI / 2) + (rand() - 0.5) * 0.06;
}
SIZES.forEach((sz, k) => {
  scatter(sz.cell, d => (sz.per * d + sz.per0) * Q, (x, z, d) => {
    const bottom = lerp(sz.bottom[0], sz.bottom[1], rand());
    const w = lerp(sz.w[0], sz.w[1], rand()), h = lerp(sz.h[0], sz.h[1], Math.pow(rand(), 1.4));
    const top = bottom + h;
    const liftMax = Math.min(sz.lift, ROOF - 0.8 - top);
    addSheet(x, top, z, w, h, sz.op * (0.7 + 0.6 * rand()), gridYaw(x, z), k, rand(), Math.max(0, liftMax));
  });
});
const sheetCount = S.pos.length / 3;

// readers: the viewer and the others
const readers = [];
for (let k = 0; k < NREAD; k++) {
  const p = PLACES[(k * 3 + 1) % PLACES.length];
  readers.push({ x: k === 0 ? 0 : p.x + (rand() - 0.5) * 4, z: k === 0 ? 0 : p.z + (rand() - 0.5) * 4, tx: 0, tz: 0, yaw: rand() * 6.2832, walking: false, timer: 20 + rand() * 60, dwell: 10 + rand() * 60, speed: 0.7 + rand() * 0.35, R: 4, s: 0, active: k === 0 || k < (lite ? 7 : NREAD), simActive: k === 0 || k < (lite ? 7 : NREAD), real: false });
}
function pickPlace(r) {
  let p;
  do { p = PLACES[Math.floor(rand() * PLACES.length)]; } while (wdist(p.x, p.z, r.x, r.z) < 6);
  r.tx = p.x + (rand() - 0.5) * 5; r.tz = p.z + (rand() - 0.5) * 5; r.walking = true;
}
function readerField(r) {
  // the opening grows with the time spent standing still
  r.R = 4 + 8 * (1 - Math.exp(-r.dwell / 40));
  r.s = r.walking ? 0.55 : 0.6 + 0.4 * (1 - Math.exp(-r.dwell / 20));
}

// ---------------------------------------------------------------- shared GLSL
const U = {
  uTime: { value: 0 }, uTile: { value: T }, uFogNear: { value: FOG_NEAR }, uFogFar: { value: FOG_FAR },
  uRoof: { value: ROOF }, uDpr: { value: 1 }, uCamPos: { value: new THREE.Vector3() },
  uSkyA: { value: SKY.map(s => new THREE.Vector4(s.x, s.z, Math.cos(s.rot), Math.sin(s.rot))) },
  uSkyB: { value: SKY.map(s => new THREE.Vector4(s.w / 2, s.h / 2, s.i, 5.0)) },
  uRead: { value: readers.map(() => new THREE.Vector4(0, 0, 0, 0)) },
  uDensity: { value: null },
};

const COMMON = /* glsl */`
#define NSKY 5
#define NREAD ${NREAD}
uniform float uTime;
uniform float uTile;
uniform float uFogNear;
uniform float uFogFar;
uniform float uRoof;
uniform vec3 uCamPos;
uniform vec4 uSkyA[NSKY];
uniform vec4 uSkyB[NSKY];
uniform vec4 uRead[NREAD];
uniform sampler2D uDensity;
vec2 pdelta(vec2 a, vec2 b) { vec2 d = a - b; return mod(d + 0.5 * uTile, uTile) - 0.5 * uTile; }
vec2 wrapXZ(vec2 p) { return uCamPos.xz + pdelta(p, uCamPos.xz); }
float fogAt(vec3 wp) { return smoothstep(uFogNear, uFogFar, distance(wp, uCamPos)); }
float skyBox(int i, vec2 xz, float spread) {
  vec4 A = uSkyA[i]; vec4 B = uSkyB[i];
  vec2 d = pdelta(xz, A.xy);
  float u = abs(d.x * A.z + d.y * A.w);
  float v = abs(-d.x * A.w + d.y * A.z);
  float soft = B.w + spread * 0.16;
  float hw = B.x + spread * 0.05, hh = B.y + spread * 0.05;
  return (1.0 - smoothstep(hw - soft, hw + soft, u)) * (1.0 - smoothstep(hh - soft, hh + soft, v)) * B.z;
}
float openAt(vec2 xz) {
  float o = 0.0;
  for (int i = 0; i < NREAD; i++) {
    vec4 r = uRead[i];
    if (r.w <= 0.0) continue;
    float d = length(pdelta(xz, r.xy));
    o += r.w * (1.0 - smoothstep(r.z * 0.45, r.z, d));
  }
  return clamp(o, 0.0, 1.0);
}
float densityAt(vec2 xz) { return texture2D(uDensity, xz / uTile).r; }
float transAt(vec3 wp) {
  return exp(-0.035 * max(0.0, uRoof - wp.y) * densityAt(wp.xz) * (1.0 - openAt(wp.xz)));
}
vec3 illumAt(vec3 wp, out float direct) {
  float spread = max(0.0, uRoof - wp.y);
  float s = 0.0;
  for (int i = 0; i < NSKY; i++) s += skyBox(i, wp.xz, spread);
  float vert = 0.40 + 0.60 * pow(clamp(wp.y / uRoof, 0.0, 1.0), 1.2);
  s *= vert * transAt(wp);
  direct = s;
  return vec3(0.64, 0.68, 0.78) * 0.26 + vec3(1.0, 0.93, 0.80) * s * 1.3;
}
float reflAt(vec3 wpm) {
  vec3 d = normalize(wpm - uCamPos);
  float cosT = max(0.0, -d.y);
  float F = 0.2 + 0.8 * pow(1.0 - cosT, 3.0);
  return F * exp(-max(0.0, -wpm.y) * 0.016);
}
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = hash12(i), b = hash12(i + vec2(1.0, 0.0)), c = hash12(i + vec2(0.0, 1.0)), d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
`;

// ---------------------------------------------------------------- paper
const sheetVert = COMMON + /* glsl */`
attribute vec3 iPos;
attribute vec3 iSize;
attribute vec4 iRot;
attribute float iLift;
attribute float iSway;
uniform float uMirror;
varying vec2 vUv;
varying vec3 vWorld;
varying vec3 vLit;
varying vec3 vNormal;
varying float vFog;
varying vec4 vData;
varying float vOp;
varying float vRefl;
varying float vLift;
mat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0.0, -s, 0.0, 1.0, 0.0, s, 0.0, c); }
void main() {
  vUv = uv;
  float w = iSize.x, h = iSize.y;
  float yaw = iRot.x, seed = iRot.z, phase = iRot.w;
  vec2 axz = wrapXZ(iPos.xz);
  vec3 anchor = vec3(axz.x, iPos.y + iLift, axz.y);
  if (distance(axz, uCamPos.xz) > uFogFar + 25.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); vFog = 1.0; return; }
  float hang = 1.0 - uv.y;
  mat3 R = rotY(yaw);
  vec3 n = R * vec3(0.0, 0.0, 1.0);
  vec3 local = vec3((uv.x - 0.5) * w, -hang * h, 0.0);
  float bend = pow(hang, 1.6);
  float sway = sin(uTime * 0.19 + phase) * 0.006 * h + sin(uTime * 0.07 + phase * 2.0) * 0.004 * h;
  float curl = sin(uv.x * 3.14159) * 0.014 * h * sin(seed * 12.0);
  float swing = iSway * sin(uTime * 2.1 + phase) * 0.05 * h;
  local.z += bend * (sway + curl + swing);
  local.x += bend * iSway * sin(uTime * 1.3 + phase * 1.7) * 0.012 * h;
  local = R * local;
  vec3 wp = anchor + local;
  vLit = wp;
  vRefl = 1.0;
  if (uMirror < 0.0) { wp.y = -wp.y; n.y = -n.y; vRefl = reflAt(wp); }
  vWorld = wp; vNormal = n; vData = vec4(seed, iRot.y, w, h); vOp = iSize.z; vLift = iLift;
  vFog = fogAt(wp);
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}
`;
const sheetFrag = COMMON + /* glsl */`
varying vec2 vUv;
varying vec3 vWorld;
varying vec3 vLit;
varying vec3 vNormal;
varying float vFog;
varying vec4 vData;
varying float vOp;
varying float vRefl;
varying float vLift;
uniform float uOpacity;
float textBlock(vec2 uv, float seed) {
  vec2 m = vec2(0.13, 0.11);
  vec2 q = (uv - m) / (1.0 - 2.0 * m);
  if (q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0) return 0.0;
  float nl = 22.0 + floor(fract(seed * 4.7) * 18.0);
  float ly = (1.0 - q.y) * nl;
  float li = floor(ly), lf = fract(ly);
  float vis = smoothstep(1.2, 0.4, fwidth(ly));
  float len = 0.6 + 0.4 * hash12(vec2(li, seed * 100.0));
  float on = step(lf, 0.5) * step(q.x, len);
  on *= step(0.1, hash12(vec2(li * 3.0 + 1.0, seed * 50.0)));
  on *= 0.55 + 0.45 * hash12(vec2(floor(q.x * 40.0), li + seed));
  return mix(0.28, on, vis);
}
void main() {
  if (vFog > 0.995) discard;
  float seed = vData.x, kind = vData.y, w = vData.z, h = vData.w;
  vec2 pu = vUv * vec2(w, h);
  vec2 fc = pu * 6.0 + seed * 37.0;
  float lod = smoothstep(1.0, 0.25, fwidth(fc.x));
  float lod2 = smoothstep(1.0, 0.25, fwidth(fc.x) * 5.0);
  float fiber = mix(0.5, vnoise(fc) * 0.5 + vnoise(fc * 2.7 + 11.0) * 0.3 + mix(0.5, vnoise(fc * 5.3 + 23.0), lod2) * 0.2, lod);
  float stain = vnoise(pu * 0.3 + seed * 9.0);
  float ink = 0.0;
  float ks = fract(seed * 17.31);
  if (ks < 0.6) ink = textBlock(vUv, seed) * (0.10 + 0.16 * fract(seed * 5.7));
  vec3 paper = mix(vec3(0.93, 0.90, 0.84), vec3(0.95, 0.86, 0.68), 0.7 * fract(seed * 3.9));
  paper = mix(paper, vec3(0.84, 0.87, 0.90), 0.7 * step(0.86, fract(seed * 9.1)));
  vec3 col = paper * (0.9 + 0.16 * (fiber - 0.5)) * (0.9 + 0.2 * (stain - 0.5)) * (1.0 - ink);
  float so; vec3 light = illumAt(vLit, so);
  light *= 1.0 + 0.7 * smoothstep(0.0, 8.0, vLift);
  vec3 V = normalize(uCamPos - vWorld);
  float nv = abs(dot(normalize(vNormal), V));
  float facing = smoothstep(0.0, 0.22, nv);
  float ew = max(0.012, fwidth(vUv.x) * 1.6);
  float ewy = max(0.012 * w / h, fwidth(vUv.y) * 1.6);
  float edge = 1.0 - smoothstep(0.0, ew, min(vUv.x, 1.0 - vUv.x));
  edge = max(edge, 1.0 - smoothstep(0.0, ewy, vUv.y));
  col *= 0.66 + 0.5 * vUv.y;
  col = col * light;
  vec3 edgeCol = light * (0.3 + 0.2 * so) * edge;
  col = mix(col, col * vec3(0.78, 0.88, 1.08), vFog * 0.7);
  float a = uOpacity * vOp * facing * (1.0 - vFog) * vRefl;
  gl_FragColor = vec4(col * a + edgeCol * (1.0 - vFog) * vRefl * smoothstep(0.0, 0.08, nv), 1.0);
}
`;

// ---------------------------------------------------------------- hairlines: threads and the roof grid
const lineVert = COMMON + /* glsl */`
attribute vec2 aMid;
attribute float aShade;
attribute float aLift;
attribute float aTop;
uniform float uMirror;
varying vec3 vCol;

let last = t0, ema = 1 / 60, adaptAt = t0 + 3, prevX = cam.x, prevZ = cam.z;
apPick();
ap.tx = PLACES[4].x + 1; ap.tz = PLACES[4].z - 1;
man.yaw = cam.yaw;
readers.forEach((rd, i) => U.uRead.value[i].set(rd.x, rd.z, rd.R, rd.active ? rd.s : 0));
updateLifts(60);
{
  const qs = new URLSearchParams(location.search);
  if (qs.has('pitch') || qs.has('yaw') || qs.has('at')) { auto = 0; man.pitch = parseFloat(qs.get('pitch') || '0'); man.yaw = parseFloat(qs.get('yaw') || '0'); lastInput = 1e9; }
  if (qs.has('at')) { const p = PLACES[parseInt(qs.get('at'), 10) % PLACES.length]; man.x = p.x; man.z = p.z; }
}
function frame() {
  requestAnimationFrame(frame);
  const nowS = performance.now() / 1000;
  const dt = Math.min(0.05, nowS - last);
  last = nowS;
  const t = nowS - t0; tNow = t;
  U.uTime.value = t;
  SKY.forEach((sk, i) => { const b = sk.i * (0.86 + 0.14 * Math.sin(t * (0.021 + 0.004 * i) + i * 1.7)); U.uSkyB.value[i].z = b; skyMeshes[i].material.uniforms.uIntensity.value = b; });

  ema += (dt - ema) * 0.05;
  if (nowS > adaptAt) {
    adaptAt = nowS + 2.5;
    const cap = Math.min(devicePixelRatio || 1, lite ? 1.5 : 2);
    if (ema > 1 / 36 && dpr > 0.75) { dpr = Math.max(0.75, dpr - 0.25); resize(); }
    else if (ema < 1 / 70 && dpr < cap) { dpr = Math.min(dpr + 0.25, cap); resize(); }
  }

  // who leads: the walk, or the hand
  const wantAuto = (t - lastInput) > 25;
  auto = clamp(auto + (wantAuto ? dt / 8 : -dt / 0.6), 0, 1);
  const k = smooth(0, 1, auto);
  if (auto > 0.001) updateAuto(dt, t);
  if (keys.has('KeyW') || keys.has('ArrowUp')) vel.f = clamp(vel.f + 2.2 * dt, -3.5, 3.5);
  if (keys.has('KeyS') || keys.has('ArrowDown')) vel.f = clamp(vel.f - 2.2 * dt, -3.5, 3.5);
  if (keys.has('KeyA') || keys.has('ArrowLeft')) vel.yaw += 1.2 * dt;
  if (keys.has('KeyD') || keys.has('ArrowRight')) vel.yaw -= 1.2 * dt;
  if (keys.size) touched();
  man.yaw += vel.yaw * dt; man.pitch = clamp(man.pitch + vel.pitch * dt, -0.9, 1.2);
  man.x += -Math.sin(man.yaw) * vel.f * dt; man.z += -Math.cos(man.yaw) * vel.f * dt;
  vel.f *= Math.exp(-dt * 1.4); vel.yaw *= Math.exp(-dt * 3.5); vel.pitch *= Math.exp(-dt * 3.5);
  man.x = ((man.x % T) + T) % T; man.z = ((man.z % T) + T) % T;
  cam.x = man.x + wdelta(ap.x, man.x) * k; cam.z = man.z + wdelta(ap.z, man.z) * k; cam.y = EYE;
  cam.yaw = alerp(man.yaw, ap.yaw, k); cam.pitch = lerp(man.pitch, ap.pitch, k);
  if (auto >= 0.999) Object.assign(man, cam);
  fovNow = lerp(fovNow, lerp(48, ap.fov, k), 1 - Math.exp(-dt / 3));

  // the viewer is reader zero: standing still opens the archive
  const moved = Math.hypot(wdelta(cam.x, prevX), wdelta(cam.z, prevZ)); prevX = cam.x; prevZ = cam.z;
  const me = readers[0];
  me.x = cam.x; me.z = cam.z;
  const still = moved / Math.max(dt, 1e-3) < 0.2;
  const prevDwell = me.dwell;
  me.walking = !still;
  me.dwell = still ? me.dwell + dt : Math.max(0, me.dwell - dt * 3);
  if (me.wasStill && !still && prevDwell > 20) leavePage(me, true);
  me.wasStill = still;
  readerField(me);
  if (roomRef && t - lastSent > 0.5) {
    const px = Math.round(cam.x * 10) / 10, pz = Math.round(cam.z * 10) / 10, pd = Math.round(me.dwell);
    const key = px + ',' + pz + ',' + pd + ',' + me.walking;
    if (key !== sentKey) { sentKey = key; lastSent = t; roomRef.presence({ x: px, z: pz, d: pd, w: me.walking }).catch(() => {}); }
  }
  updateReaders(dt);
  updateLifts(dt);
  updateSound(dt);
  readers.forEach((r, i) => U.uRead.value[i].set(r.x, r.z, r.R, r.active ? r.s : 0));

  const lk = 1 - Math.exp(-dt * 1.3), amp = reduceMotion ? 0.3 : 1;
  lean.x += (mx * 0.6 * amp - lean.x) * lk; lean.y += (-my * 0.3 * amp - lean.y) * lk;
  lean.yaw += (-mx * 0.03 * amp - lean.yaw) * lk; lean.pitch += (-my * 0.02 * amp - lean.pitch) * lk;
  const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  camera.position.set(cam.x + rx * lean.x, cam.y + lean.y, cam.z + rz * lean.x);
  camera.rotation.set(cam.pitch + lean.pitch, cam.yaw + lean.yaw, 0);
  camera.fov = camera.aspect < 1 ? 2 * Math.atan(Math.tan(fovNow * Math.PI / 360) / camera.aspect) * 180 / Math.PI : fovNow;
  camera.updateProjectionMatrix();
  U.uCamPos.value.copy(camera.position);
  water.position.set(camera.position.x, 0, camera.position.z);
  horizon.position.set(camera.position.x, 0, camera.position.z);
  for (const b of beams) { b.mesh.position.x = camera.position.x + wdelta(b.s.x, camera.position.x); b.mesh.position.z = camera.position.z + wdelta(b.s.z, camera.position.z); b.mesh.material.uniforms.uBoxC.value.set(b.mesh.position.x, b.mirror * ROOF / 2, b.mesh.position.z); }
  SKY.forEach((s, i) => { const m = skyMeshes[i]; m.position.x = camera.position.x + wdelta(s.x, camera.position.x); m.position.z = camera.position.z + wdelta(s.z, camera.position.z); });
  compMat.uniforms.uFade.value = clamp((t - 0.3) / 4.0, 0, 1);

  renderer.setRenderTarget(sceneRT);
  renderer.clear(true, true, false);
  renderer.render(scene, camera);
  down(sceneRT, rtA, 0.2);
  blur(rtA, rtA2, 1.0);
  blur(rtA, rtA2, 1.6);
  down(rtA, rtB, 0.0);
  blur(rtB, rtB2, 1.2);
  blur(rtB, rtB2, 2.0);
  pass(compMat, null);
}
frame();
console.log('sheets', sheetCount, 'thread vertices', threadVerts, 'line vertices', L.pos.length / 3, 'readers', readers.filter(r => r.active).length, 'places', PLACES.length);
</script>
